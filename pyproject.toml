[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unlimited-ocr-server"
version = "1.0.0"
description = "OpenAI-compatible Unlimited-OCR inference server (Transformers backend)"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "transformers==4.57.1",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "pillow==12.1.1",
    "matplotlib==3.10.8",
    "einops==0.8.2",
    "addict==2.4.0",
    "easydict==1.13",
    "pymupdf==1.27.2.2",
    "psutil==7.2.2",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "requests>=2.32",
]

[project.optional-dependencies]
gpu = [
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[tool.setuptools]
py-modules = ["server"]
